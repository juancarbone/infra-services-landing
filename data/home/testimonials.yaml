featured:
  text: "Antes, cuando se caía el sistema, teníamos que esperar a que alguien contestara. Ahora escribimos y hay una persona trabajando en el problema. El cambio no fue técnico: fue dejar de sentir que estábamos solos."
  client: "Nombre Apellido"
  role: "Cargo"
  company: "Empresa"

items:
  - text: "Nos habían vendido backup durante años. El día que tuvimos el incidente descubrimos que las copias no restauraban. Ahora el backup se prueba todos los meses y nos mandan el informe."
    client: "Nombre Apellido"
    role: "Cargo"
    company: "Empresa"

  - text: "Nos daba terror mudar el sistema de gestión. Lo hicieron en ventanas nocturnas y el lunes estábamos facturando como siempre. Lo único distinto era la tranquilidad."
    client: "Nombre Apellido"
    role: "Cargo"
    company: "Empresa"

  - text: "Dejamos de enterarnos de los problemas por el reclamo de un cliente. Ahora, cuando algo falla, ya están trabajando en eso antes de que lo notemos."
    client: "Nombre Apellido"
    role: "Cargo"
    company: "Empresa"
