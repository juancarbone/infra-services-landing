baseURL = 'https://juancarbone.github.io/infra-services-landing/'
defaultContentLanguage = 'es'
title = 'Infraestructura IT'
theme = 'hugo-up-business'

# Genera /robots.txt automáticamente
enableRobotsTXT = true

# Necesario para que Tailwind detecte las clases usadas en las plantillas.
build.buildStats.enable = true
build.cachebusters = [
  { source = 'assets/notwatching/hugo_stats\\.json', target = 'css' },
  { source = '(postcss|tailwind)\\.config\\.js', target = 'css' },
]

[security.exec]
  allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']

[module]
  [[module.mounts]]
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'
    disableWatch = true

  [[module.mounts]]
    source = 'assets'
    target = 'assets'

[languages.es]
  label = 'Español'
  locale = 'es-AR'
  weight = 1

[params]
  # Descripción usada en <meta name="description"> y en Open Graph.
  description = 'Infraestructura IT gestionada para PyMEs: monitoreo 24/7, backup con restauración probada, migración cloud y contenedores. Tarifa fija, sin permanencia mínima.'

  # Versión corta para el pie de página.
  tagline = 'Servicios de infraestructura IT para PyMEs: monitoreo proactivo, respaldo gestionado, cloud y contenedores. Buenos Aires, Argentina.'

  copyright = '© 2026 Infraestructura IT. Todos los derechos reservados.'

  location = ['Buenos Aires, Argentina', 'Atendemos remoto en todo el país y en sitio en CABA y GBA.']

  # Cada ítem puede ser un mapa { label, url } o un texto plano.
  contact = [
    { label = 'contacto@ejemplo.com', url = 'mailto:contacto@ejemplo.com' },
    { label = '+54 11 0000-0000', url = 'tel:+541100000000' },
    { label = 'WhatsApp', url = 'https://wa.me/541100000000' },
  ]

[[menus.main]]
  name = 'Inicio'
  url = '/#hero'
  weight = 1

[[menus.main]]
  name = 'Servicios'
  url = '/#servicios'
  weight = 2

[[menus.main]]
  name = 'Casos'
  url = '/#portfolio'
  weight = 3

[[menus.main]]
  name = 'Contacto'
  url = 'mailto:contacto@ejemplo.com'
  weight = 4

[[menus.buttons]]
  name = 'Diagnóstico sin costo'
  url = 'mailto:contacto@ejemplo.com?subject=Quiero%20un%20diagn%C3%B3stico%20sin%20costo'
  weight = 1

[[menus.footer]]
  name = 'Inicio'
  url = '/#hero'
  weight = 1

[[menus.footer]]
  name = 'Servicios'
  url = '/#servicios'
  weight = 2

[[menus.footer]]
  name = 'Casos'
  url = '/#portfolio'
  weight = 3

[[menus.footer]]
