{{/* Open Graph propio (reemplaza el template interno de Hugo).
     Emite og:image con la pieza de marca 1200×630. */}}
{{ $ogImage := resources.Get "images/og-image.png" }}
<meta property="og:title" content="{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }}{{ end }}" />
<meta property="og:site_name" content="{{ site.Params.brand | default site.Title }}" />
<meta property="og:description" content="{{ site.Params.description }}" />
<meta property="og:url" content="{{ .Permalink }}" />
<meta property="og:locale" content="es_AR" />
<meta property="og:type" content="website" />
{{ with $ogImage }}
  <meta property="og:image" content="{{ .Permalink }}" />
  <meta property="og:image:width" content="{{ .Width }}" />
  <meta property="og:image:height" content="{{ .Height }}" />
  <meta property="og:image:alt" content="BSys — infraestructura IT gestionada para PyMEs" />
{{ end }}
